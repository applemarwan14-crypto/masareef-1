name: Deploy Supabase functions

# ينشر دوال الخادم (sms, ai, push) عند تعديلها على main.
# يحتاج سرّين في GitHub: SUPABASE_ACCESS_TOKEN (من supabase.com/dashboard/account/tokens) و SUPABASE_PROJECT_REF.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::أضف SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_REF في أسرار GitHub لنشر الدوال تلقائياً"
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
